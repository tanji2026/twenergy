<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>碳吉 TanJi - 影片縮圖設計</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;700;900&display=swap" rel="stylesheet">
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        brand: { green: '#10b981', blue: '#0ea5e9' }
                    },
                    fontFamily: { sans: ['Noto Sans TC', 'sans-serif'] }
                }
            }
        }
    </script>
    <style>
        .thumbnail-container {
            width: 1280px;
            height: 720px;
            background-color: #0f172a;
            position: relative;
            overflow: hidden;
            font-family: 'Noto Sans TC', sans-serif;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
            transform-origin: top left;
        }
        
        .glass-panel {
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
        }

        .perspective-wrapper {
            perspective: 2000px;
        }
        
        .isometric-ui {
            transform: rotateY(-15deg) rotateX(10deg) rotateZ(2deg);
            transform-style: preserve-3d;
        }
        
        .glow-blob-1 {
            position: absolute;
            top: -100px;
            left: -100px;
            width: 600px;
            height: 600px;
            background: radial-gradient(circle, rgba(16,185,129,0.4) 0%, rgba(15,23,42,0) 70%);
            border-radius: 50%;
            z-index: 0;
        }
        
        .glow-blob-2 {
            position: absolute;
            bottom: -200px;
            right: -100px;
            width: 800px;
            height: 800px;
            background: radial-gradient(circle, rgba(14,165,233,0.3) 0%, rgba(15,23,42,0) 70%);
            border-radius: 50%;
            z-index: 0;
        }

        .grid-bg {
            position: absolute;
            inset: 0;
            background-image: 
                linear-gradient(to right, rgba(255,255,255,0.03) 1px, transparent 1px),
                linear-gradient(to bottom, rgba(255,255,255,0.03) 1px, transparent 1px);
            background-size: 40px 40px;
            z-index: 0;
            opacity: 0.5;
        }

        @keyframes scan {
            0% { left: -10%; }
            100% { left: 110%; }
        }
        
        @media (max-width: 1350px) {
            .thumbnail-container {
                transform: scale(0.8);
            }
        }
        @media (max-width: 1100px) {
            .thumbnail-container {
                transform: scale(0.6);
            }
        }
        @media (max-width: 800px) {
            .thumbnail-container {
                transform: scale(0.4);
            }
        }
    </style>
</head>
<body class="bg-gray-800 min-h-screen flex items-center justify-center p-4">

    <button id="download-btn" class="fixed top-4 left-4 bg-brand-green hover:bg-emerald-500 text-white font-bold py-3 px-6 rounded-xl shadow-lg z-50 flex items-center gap-3 transition-all duration-300 transform hover:-translate-y-1">
        <i class="fa-solid fa-download text-xl"></i>
        <span>下載高品質縮圖 (PNG)</span>
    </button>

    <div class="thumbnail-container flex items-center" id="thumbnail-canvas">
        <div class="glow-blob-1"></div>
        <div class="glow-blob-2"></div>
        <div class="grid-bg"></div>

        <div class="w-5/12 pl-20 relative z-20 flex flex-col justify-center h-full">
            
            <div class="flex items-center gap-4 mb-8">
                <div class="w-16 h-16 bg-gradient-to-br from-brand-green to-brand-blue rounded-2xl flex items-center justify-center text-white font-bold text-3xl shadow-lg shadow-brand-green/30">
                    <i class="fa-solid fa-leaf"></i>
                </div>
                <span class="font-bold text-5xl tracking-tight text-white">碳吉 <span class="text-brand-green font-light">TanJi</span></span>
            </div>

            <div class="inline-block bg-brand-green/20 border border-brand-green text-brand-green font-bold px-4 py-2 rounded-full text-xl mb-6 w-max backdrop-blur-sm">
                <i class="fa-solid fa-wallet mr-2"></i>全台首創 淨零群募平台
            </div>

            <h1 class="text-7xl font-black text-white leading-[1.15] mb-6 tracking-wide" style="text-shadow: 0 10px 20px rgba(0,0,0,0.5);">
                百元即刻參與<br>
                <span class="text-transparent bg-clip-text bg-gradient-to-r from-brand-green to-brand-blue" style="text-shadow: none;">綠能永續轉型</span>
            </h1>

            <p class="text-3xl text-slate-300 font-bold border-l-4 border-brand-green pl-6 mt-4">
                微型贊助 ✕ 遊戲化回饋
            </p>
        </div>

        <div class="w-7/12 relative z-10 perspective-wrapper pr-12">
            <div class="isometric-ui w-full relative">
                
                <div class="glass-panel rounded-3xl p-8 w-full max-w-[800px] ml-auto relative">
                    
                    <div class="flex gap-2 mb-6">
                        <div class="w-4 h-4 rounded-full bg-red-500"></div>
                        <div class="w-4 h-4 rounded-full bg-yellow-500"></div>
                        <div class="w-4 h-4 rounded-full bg-green-500"></div>
                    </div>

                    <div class="flex gap-4 mb-8">
                        <div class="flex-grow relative">
                            <i class="fa-solid fa-solar-panel absolute left-5 top-1/2 transform -translate-y-1/2 text-slate-400 text-xl"></i>
                            <div class="w-full bg-slate-800/80 border border-slate-600 rounded-xl py-5 pl-14 pr-4 text-white text-xl flex items-center">
                                100kW 廠房屋頂太陽能建置...
                                <div class="ml-auto flex items-center gap-2">
                                    <span class="w-3 h-3 bg-brand-green rounded-full animate-pulse"></span>
                                    <span class="text-sm text-brand-green font-mono">募資中</span>
                                </div>
                            </div>
                        </div>
                    </div>

                    <div class="grid grid-cols-2 gap-6 mb-6">
                        
                        <div class="bg-emerald-500/20 border-2 border-emerald-500/50 p-6 rounded-2xl flex items-start gap-5 transform translate-z-10 shadow-2xl shadow-emerald-900/20">
                            <div class="bg-emerald-500 p-4 rounded-xl text-white text-3xl"><i class="fa-solid fa-cloud-arrow-down"></i></div>
                            <div>
                                <h4 class="font-bold text-emerald-300 text-lg">預估減碳貢獻</h4>
                                <p class="text-4xl font-black text-white mt-1 mb-1">6.0 <span class="text-xl">kg</span></p>
                                <span class="bg-emerald-500/30 text-emerald-200 text-xs px-2 py-1 rounded">科學數據量化評估</span>
                            </div>
                        </div>

                        <div class="bg-blue-500/20 border-2 border-blue-500/50 p-6 rounded-2xl flex items-start gap-5 transform translate-z-10 shadow-2xl shadow-blue-900/20">
                            <div class="bg-blue-500 p-4 rounded-xl text-white text-3xl"><i class="fa-solid fa-star"></i></div>
                            <div>
                                <h4 class="font-bold text-blue-300 text-lg">獲得寶寶經驗值</h4>
                                <p class="text-4xl font-black text-white mt-1 mb-1">+50 <span class="text-xl">EXP</span></p>
                                <span class="bg-blue-500/30 text-blue-200 text-xs px-2 py-1 rounded">解鎖專屬永續回饋</span>
                            </div>
                        </div>

                    </div>

                    <div class="bg-slate-800/80 border border-slate-600 rounded-2xl p-6 relative overflow-hidden h-[160px] flex flex-col justify-center items-center text-center">
                        <div class="text-2xl text-slate-300 font-bold mb-1 relative z-10">
                            本次贊助金額
                        </div>
                        <div class="text-5xl font-black text-white relative z-10">
                            <span class="text-brand-green">NT$</span> 500
                        </div>
                        <div class="absolute inset-0 bg-brand-green/10" style="background-image: radial-gradient(rgba(16, 185, 129, 0.4) 1px, transparent 1px); background-size: 20px 20px;"></div>
                        <div class="absolute top-0 bottom-0 w-8 bg-gradient-to-r from-transparent via-brand-green to-transparent opacity-80" style="animation: scan 3s linear infinite; left: -10%;"></div>
                    </div>

                </div>

                <div class="absolute -bottom-10 -left-16 bg-white rounded-2xl p-5 shadow-2xl flex items-center gap-5 transform translate-z-20 border-4 border-slate-100">
                    <div class="w-20 h-20 rounded-full bg-slate-50 flex items-center justify-center border-2 border-slate-100 overflow-hidden shadow-inner">
                        <img src="tanjibaby.png" alt="碳吉寶寶" class="w-full h-full object-cover">
                    </div>
                    <div>
                        <div class="text-sm text-slate-500 font-bold mb-1">碳吉寶寶 Lv.1</div>
                        <div class="text-2xl font-black text-slate-800">感謝你的贊助！</div>
                    </div>
                    <div class="text-brand-green text-4xl ml-3"><i class="fa-solid fa-circle-check"></i></div>
                </div>

            </div>
        </div>
    </div>

    <script>
        document.getElementById('download-btn').addEventListener('click', function() {
            const btn = this;
            const originalText = btn.innerHTML;
            const target = document.getElementById('thumbnail-canvas');
            
            btn.innerHTML = '<i class="fa-solid fa-spinner fa-spin text-xl"></i><span>處理中...</span>';
            btn.style.pointerEvents = 'none';
            btn.style.opacity = '0.8';

            const originalTransform = target.style.transform;
            target.style.transform = 'scale(1)';

            html2canvas(target, {
                width: 1280,
                height: 720,
                scale: 2,
                backgroundColor: '#0f172a',
                useCORS: true,
                logging: false
            }).then(canvas => {
                const link = document.createElement('a');
                link.download = 'TanJi_Thumbnail_UI.png';
                link.href = canvas.toDataURL('image/png');
                link.click();
                
                target.style.transform = originalTransform;
                btn.innerHTML = originalText;
                btn.style.pointerEvents = 'auto';
                btn.style.opacity = '1';
            }).catch(err => {
                console.error(err);
                alert('抱歉，截圖處理發生錯誤。');
                btn.innerHTML = originalText;
                btn.style.pointerEvents = 'auto';
                btn.style.opacity = '1';
            });
        });
    </script>
</body>
</html>
