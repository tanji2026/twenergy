<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>碳吉 TanJi - 影片縮圖設計</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;700;900&display=swap" rel="stylesheet">
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        brand: { green: '#10b981', blue: '#0ea5e9', dark: '#0f172a' }
                    },
                    fontFamily: { sans: ['Noto Sans TC', 'sans-serif'] }
                }
            }
        }
    </script>
    <style>
        .thumbnail-container {
            width: 1280px;
            height: 720px;
            background-color: #0f172a;
            position: relative;
            overflow: hidden;
            font-family: 'Noto Sans TC', sans-serif;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
            transform-origin: top left;
        }
        
        .glass-card {
            background: rgba(30, 41, 59, 0.7);
            backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.15);
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
            border-radius: 24px;
        }

        .glow-blob-1 {
            position: absolute;
            top: -150px;
            left: -150px;
            width: 800px;
            height: 800px;
            background: radial-gradient(circle, rgba(16,185,129,0.35) 0%, rgba(15,23,42,0) 70%);
            border-radius: 50%;
            z-index: 0;
        }
        
        .glow-blob-2 {
            position: absolute;
            bottom: -200px;
            right: -200px;
            width: 1000px;
            height: 1000px;
            background: radial-gradient(circle, rgba(14,165,233,0.25) 0%, rgba(15,23,42,0) 70%);
            border-radius: 50%;
            z-index: 0;
        }

        .grid-bg {
            position: absolute;
            inset: 0;
            background-image: 
                linear-gradient(to right, rgba(255,255,255,0.04) 1px, transparent 1px),
                linear-gradient(to bottom, rgba(255,255,255,0.04) 1px, transparent 1px);
            background-size: 50px 50px;
            z-index: 0;
        }

        .floating { animation: float 6s ease-in-out infinite; }
        .floating-delay-1 { animation: float 6s ease-in-out 1s infinite; }
        .floating-delay-2 { animation: float 6s ease-in-out 2s infinite; }
        
        @keyframes float {
            0% { transform: translateY(0px); }
            50% { transform: translateY(-20px); }
            100% { transform: translateY(0px); }
        }

        @media (max-width: 1350px) {
            .thumbnail-container { transform: scale(0.8); }
        }
        @media (max-width: 1100px) {
            .thumbnail-container { transform: scale(0.6); }
        }
        @media (max-width: 800px) {
            .thumbnail-container { transform: scale(0.4); }
        }
    </style>
</head>
<body class="bg-gray-900 min-h-screen flex items-center justify-center p-4">

    <button id="download-btn" class="fixed top-4 left-4 bg-brand-green hover:bg-emerald-500 text-white font-bold py-3 px-6 rounded-xl shadow-lg z-50 flex items-center gap-3 transition-all duration-300 transform hover:-translate-y-1">
        <i class="fa-solid fa-download text-xl"></i>
        <span>下載高品質縮圖 (PNG)</span>
    </button>

    <div class="thumbnail-container" id="thumbnail-canvas">
        <!-- 背景元素 -->
        <div class="glow-blob-1"></div>
        <div class="glow-blob-2"></div>
        <div class="grid-bg"></div>

        <div class="relative z-10 w-full h-full flex items-center px-16">
            
            <!-- 左側：強烈的重點文字區 -->
            <div class="w-6/12 flex flex-col justify-center h-full pr-8">
                
                <!-- 品牌 Logo 區 -->
                <div class="flex items-center gap-4 mb-8">
                    <div class="w-20 h-20 bg-gradient-to-br from-brand-green to-brand-blue rounded-3xl flex items-center justify-center text-white font-bold text-4xl shadow-[0_0_30px_rgba(16,185,129,0.4)]">
                        <i class="fa-solid fa-leaf"></i>
                    </div>
                    <div>
                        <span class="block text-2xl text-brand-green font-bold tracking-widest mb-1">全台首創 淨零群募平台</span>
                        <span class="font-black text-5xl tracking-tight text-white">碳吉 <span class="font-light">TanJi</span></span>
                    </div>
                </div>

                <!-- 核心標題 -->
                <h1 class="text-[85px] font-black text-white leading-[1.1] mb-6 tracking-wide drop-shadow-2xl">
                    全民參與<br>
                    <span class="text-transparent bg-clip-text bg-gradient-to-r from-brand-green to-cyan-400">淨零群募平台</span>
                </h1>

                <!-- 賣點副標題 -->
                <div class="space-y-4 border-l-8 border-brand-green pl-6 mt-4">
                    <p class="text-4xl text-white font-bold drop-shadow-md">
                        百元贊助 <span class="text-brand-green mx-2">✕</span> 專款專用
                    </p>
                    <p class="text-3xl text-slate-300 font-bold">
                        遊戲化永續回饋機制
                    </p>
                </div>
            </div>

            <!-- 右側：碳吉寶寶與浮動 UI 展示區 -->
            <div class="w-6/12 relative h-full flex items-center justify-center">
                
                <!-- 核心吉祥物：碳吉寶寶 (已替換為正版圖片) -->
                <div class="relative z-20 floating w-[500px] h-[500px] flex items-center justify-center">
                    <!-- 加上背後高光暈影，確保深灰色的寶寶在深色背景中能完美凸顯 -->
                    <div class="absolute inset-0 bg-emerald-400/40 rounded-full blur-[100px] z-0"></div>
                    <img src="tanjibaby.png" alt="碳吉寶寶" class="w-full h-full object-contain relative z-10 drop-shadow-[0_30px_50px_rgba(16,185,129,0.6)]">
                </div>

                <!-- 浮動 UI 1：贊助與減碳效益 -->
                <div class="glass-card absolute top-24 left-0 p-6 flex items-center gap-5 z-30 floating-delay-1 border-l-4 border-l-brand-green">
                    <div class="w-16 h-16 rounded-2xl bg-white flex items-center justify-center text-brand-green text-3xl shadow-inner">
                        <i class="fa-solid fa-hand-holding-dollar"></i>
                    </div>
                    <div>
                        <div class="text-slate-300 font-bold text-lg mb-1">本次贊助 NT$ 500</div>
                        <div class="text-3xl font-black text-white">
                            減碳 <span class="text-brand-green">6.0</span> kg
                        </div>
                    </div>
                </div>

                <!-- 浮動 UI 2：獲得經驗值 -->
                <div class="glass-card absolute bottom-24 right-0 p-6 flex items-center gap-5 z-30 floating-delay-2 border-l-4 border-l-blue-400">
                    <div class="w-16 h-16 rounded-2xl bg-blue-500 flex items-center justify-center text-white text-3xl shadow-lg">
                        <i class="fa-solid fa-star"></i>
                    </div>
                    <div>
                        <div class="text-blue-200 font-bold text-lg mb-1">永續帳戶已注入能量</div>
                        <div class="text-3xl font-black text-white">
                            獲得 <span class="text-blue-400">+50</span> EXP
                        </div>
                    </div>
                </div>

                <!-- 背景光環裝飾 -->
                <div class="absolute inset-0 flex items-center justify-center z-0">
                    <div class="w-[500px] h-[500px] border border-emerald-500/30 rounded-full animate-[spin_20s_linear_infinite] border-dashed"></div>
                    <div class="absolute w-[600px] h-[600px] border border-blue-500/20 rounded-full animate-[spin_30s_linear_infinite_reverse]"></div>
                </div>

            </div>
        </div>
    </div>

    <script>
        document.getElementById('download-btn').addEventListener('click', function() {
            const btn = this;
            const originalText = btn.innerHTML;
            const target = document.getElementById('thumbnail-canvas');
            
            // 處理中狀態
            btn.innerHTML = '<i class="fa-solid fa-spinner fa-spin text-xl"></i><span>處理中...</span>';
            btn.style.pointerEvents = 'none';
            btn.style.opacity = '0.8';

            // 移除可能影響截圖的縮放與動畫
            const originalTransform = target.style.transform;
            target.style.transform = 'scale(1)';
            
            // 停用所有浮動動畫以防止截圖模糊
            const floatingElements = target.querySelectorAll('.floating, .floating-delay-1, .floating-delay-2');
            floatingElements.forEach(el => el.style.animation = 'none');

            // 確保字型載入
            document.fonts.ready.then(() => {
                setTimeout(() => {
                    html2canvas(target, {
                        width: 1280,
                        height: 720,
                        scale: 2, // 提高解析度 (2560x1440)
                        backgroundColor: '#0f172a',
                        useCORS: true,
                        logging: false
                    }).then(canvas => {
                        const link = document.createElement('a');
                        link.download = '碳吉_TanJi_影片縮圖.png';
                        link.href = canvas.toDataURL('image/png');
                        link.click();
                        
                        // 恢復原狀
                        target.style.transform = originalTransform;
                        floatingElements.forEach(el => el.style.animation = '');
                        btn.innerHTML = originalText;
                        btn.style.pointerEvents = 'auto';
                        btn.style.opacity = '1';
                    }).catch(err => {
                        console.error(err);
                        alert('抱歉，截圖處理發生錯誤。');
                        target.style.transform = originalTransform;
                        floatingElements.forEach(el => el.style.animation = '');
                        btn.innerHTML = originalText;
                        btn.style.pointerEvents = 'auto';
                        btn.style.opacity = '1';
                    });
                }, 500); // 緩衝時間
            });
        });
    </script>
</body>
</html>
